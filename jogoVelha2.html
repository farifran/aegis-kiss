<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha 2 (Antigravity Direct Build)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c16;
            --card-bg: rgba(18, 22, 41, 0.75);
            --border-glow: rgba(255, 255, 255, 0.1);
            --color-x: #00f2fe;
            --color-x-glow: rgba(0, 242, 254, 0.5);
            --color-o: #ff0844;
            --color-o-glow: rgba(255, 8, 68, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 8, 68, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 99; }
        .container {
            width: 100%; max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 32px 28px;
            display: flex; flex-direction: column; gap: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        header { text-align: center; }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem; font-weight: 700;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #ff0844 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
        select, button {
            font-family: inherit; outline: none;
            border: 1px solid var(--border-glow);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main); padding: 10px 14px; border-radius: 14px;
            font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.25s;
        }
        select:hover, button:hover { border-color: rgba(255, 255, 255, 0.3); background: rgba(30, 41, 59, 0.8); }
        .scoreboard {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            background: rgba(15, 23, 42, 0.4); padding: 12px; border-radius: 16px; text-align: center;
        }
        .score-box .label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
        .score-box .val { font-size: 1.4rem; font-weight: 900; font-family: 'Space Grotesk', sans-serif; }
        .score-box.player-x .val { color: var(--color-x); text-shadow: 0 0 10px var(--color-x-glow); }
        .score-box.player-o .val { color: var(--color-o); text-shadow: 0 0 10px var(--color-o-glow); }
        .status-bar {
            text-align: center; font-size: 1.05rem; font-weight: 600; padding: 10px;
            border-radius: 12px; background: rgba(255, 255, 255, 0.03); min-height: 44px;
            display: flex; align-items: center; justify-content: center;
        }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; aspect-ratio: 1 / 1; }
        .cell {
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px; display: flex; justify-content: center; align-items: center;
            font-size: 3rem; font-weight: 900; font-family: 'Space Grotesk', sans-serif; cursor: pointer;
            transition: all 0.25s;
        }
        .cell:hover:not(.taken) { background: rgba(30, 41, 59, 0.7); transform: scale(1.03); }
        .cell.x { color: var(--color-x); text-shadow: 0 0 15px var(--color-x-glow); }
        .cell.o { color: var(--color-o); text-shadow: 0 0 15px var(--color-o-glow); }
        .cell.winning-cell { animation: pulseGlow 1s infinite alternate; background: rgba(255, 255, 255, 0.12); }
        @keyframes pulseGlow { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        .actions { display: flex; gap: 12px; }
        .btn-primary { flex: 2; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #040914; border: none; font-weight: 700; }
        .btn-secondary { flex: 1; background: rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    <main class="container">
        <header>
            <h1>JOGO DA VELHA 2</h1>
            <p style="color:var(--text-muted);font-size:0.9rem;">Antigravity Direct Single-File Build</p>
        </header>
        <div class="controls-grid">
            <div class="control-group">
                <label for="mode-select">Modo</label>
                <select id="mode-select"><option value="pve">Humano vs PC</option><option value="pvp">2 Jogadores</option></select>
            </div>
            <div class="control-group">
                <label for="difficulty-select">Dificuldade</label>
                <select id="difficulty-select"><option value="impossible" selected>Impossível (Minimax)</option><option value="medium">Médio</option><option value="easy">Fácil</option></select>
            </div>
        </div>
        <section class="scoreboard">
            <div class="score-box player-x"><span class="label">X</span><span class="val" id="score-x">0</span></div>
            <div class="score-box"><span class="label">Empates</span><span class="val" id="score-ties">0</span></div>
            <div class="score-box player-o"><span class="label">O</span><span class="val" id="score-o">0</span></div>
        </section>
        <div class="status-bar" id="status-bar">Vez do Jogador X</div>
        <div class="board" id="board">
            <button class="cell" data-index="0"></button><button class="cell" data-index="1"></button><button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button><button class="cell" data-index="4"></button><button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button><button class="cell" data-index="7"></button><button class="cell" data-index="8"></button>
        </div>
        <div class="actions">
            <button class="btn-primary" id="btn-restart">Nova Rodada</button>
            <button class="btn-secondary" id="btn-reset-score">Zerar Placar</button>
        </div>
    </main>

    <script>
        class SoundEffects {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playClick(freq = 440) {
                this.init();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            }
            playWin() {
                this.init();
                [523, 659, 783, 1046].forEach((f, i) => {
                    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.08);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.08 + 0.2);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + i * 0.08); osc.stop(this.ctx.currentTime + i * 0.08 + 0.2);
                });
            }
        }

        class Confetti {
            constructor(id) {
                this.canvas = document.getElementById(id);
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; }
            fire() {
                this.particles = [];
                const colors = ['#00f2fe', '#4facfe', '#ff0844', '#7b2cbf'];
                for (let i = 0; i < 80; i++) {
                    this.particles.push({
                        x: this.canvas.width / 2, y: this.canvas.height / 2,
                        vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.5) * 14 - 3,
                        size: Math.random() * 6 + 4, color: colors[Math.floor(Math.random() * colors.length)],
                        life: 1, decay: Math.random() * 0.02 + 0.015
                    });
                }
                this.loop();
            }
            loop() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles.forEach((p, idx) => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= p.decay;
                    if (p.life <= 0) { this.particles.splice(idx, 1); return; }
                    this.ctx.save(); this.ctx.globalAlpha = p.life;
                    this.ctx.fillStyle = p.color; this.ctx.fillRect(p.x, p.y, p.size, p.size);
                    this.ctx.restore();
                });
                if (this.particles.length > 0) requestAnimationFrame(() => this.loop());
            }
        }

        class Game {
            constructor() {
                this.board = Array(9).fill('');
                this.currentPlayer = 'X';
                this.active = true;
                this.mode = 'pve';
                this.difficulty = 'impossible';
                this.scores = { X: 0, O: 0, ties: 0 };
                this.wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                this.sfx = new SoundEffects();
                this.confetti = new Confetti('confetti-canvas');
                this.init();
            }
            init() {
                this.cells = document.querySelectorAll('.cell');
                this.status = document.getElementById('status-bar');
                this.cells.forEach(c => c.addEventListener('click', e => this.onClick(e)));
                document.getElementById('btn-restart').addEventListener('click', () => this.reset());
                document.getElementById('btn-reset-score').addEventListener('click', () => {
                    this.scores = { X: 0, O: 0, ties: 0 }; this.updateScores(); this.reset();
                });
                document.getElementById('mode-select').addEventListener('change', e => {
                    this.mode = e.target.value; this.reset();
                });
                document.getElementById('difficulty-select').addEventListener('change', e => {
                    this.difficulty = e.target.value; this.reset();
                });
            }
            onClick(e) {
                const i = parseInt(e.target.dataset.index);
                if (this.board[i] || !this.active) return;
                if (this.mode === 'pve' && this.currentPlayer !== 'X') return;
                this.play(i, this.currentPlayer);
                if (this.active && this.mode === 'pve' && this.currentPlayer === 'O') {
                    setTimeout(() => this.aiPlay(), 300);
                }
            }
            play(i, p) {
                this.board[i] = p; this.cells[i].textContent = p; this.cells[i].classList.add(p.toLowerCase());
                this.sfx.playClick(p === 'X' ? 520 : 380);
                const win = this.checkWin(this.board, p);
                if (win) {
                    this.active = false; this.scores[p]++; this.updateScores();
                    win.forEach(idx => this.cells[idx].classList.add('winning-cell'));
                    this.status.textContent = `🎉 Vitória do ${p}!`;
                    this.sfx.playWin(); this.confetti.fire(); return;
                }
                if (this.board.every(cell => cell)) {
                    this.active = false; this.scores.ties++; this.updateScores();
                    this.status.textContent = '⚖️ Empate!'; return;
                }
                this.currentPlayer = this.currentPlayer === 'X' ? 'O' : 'X';
                this.status.textContent = `Vez do Jogador ${this.currentPlayer}`;
            }
            aiPlay() {
                let i;
                if (this.difficulty === 'easy') i = this.randomMove();
                else if (this.difficulty === 'medium') i = Math.random() < 0.5 ? this.bestMove() : this.randomMove();
                else i = this.bestMove();
                if (i !== undefined && i !== -1) this.play(i, 'O');
            }
            randomMove() {
                const avail = this.board.map((v, idx) => v === '' ? idx : null).filter(v => v !== null);
                return avail[Math.floor(Math.random() * avail.length)];
            }
            bestMove() {
                let best = -Infinity, move = -1;
                for (let i = 0; i < 9; i++) {
                    if (this.board[i] === '') {
                        this.board[i] = 'O';
                        let score = this.minimax(this.board, 0, false);
                        this.board[i] = '';
                        if (score > best) { best = score; move = i; }
                    }
                }
                return move;
            }
            minimax(b, depth, isMax) {
                if (this.checkWin(b, 'O')) return 10 - depth;
                if (this.checkWin(b, 'X')) return depth - 10;
                if (b.every(cell => cell)) return 0;
                if (isMax) {
                    let best = -Infinity;
                    for (let i = 0; i < 9; i++) {
                        if (b[i] === '') {
                            b[i] = 'O';
                            best = Math.max(best, this.minimax(b, depth + 1, false));
                            b[i] = '';
                        }
                    }
                    return best;
                } else {
                    let best = Infinity;
                    for (let i = 0; i < 9; i++) {
                        if (b[i] === '') {
                            b[i] = 'X';
                            best = Math.min(best, this.minimax(b, depth + 1, true));
                            b[i] = '';
                        }
                    }
                    return best;
                }
            }
            checkWin(b, p) { return this.wins.find(c => c.every(idx => b[idx] === p)); }
            updateScores() {
                document.getElementById('score-x').textContent = this.scores.X;
                document.getElementById('score-o').textContent = this.scores.O;
                document.getElementById('score-ties').textContent = this.scores.ties;
            }
            reset() {
                this.board.fill(''); this.currentPlayer = 'X'; this.active = true;
                this.cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
                this.status.textContent = 'Vez do Jogador X';
            }
        }
        document.addEventListener('DOMContentLoaded', () => new Game());
    </script>
</body>
</html>
