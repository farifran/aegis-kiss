<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe 3D Ultra Senior | Antigravity Direct Build</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --cyan-glow: rgba(0, 243, 255, 0.6);
            --neon-magenta: #ff0055;
            --magenta-glow: rgba(255, 0, 85, 0.6);
            --glass-card: rgba(11, 15, 26, 0.82);
            --border-glow: rgba(0, 243, 255, 0.35);
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #020408;
            color: var(--text-main);
            min-height: 100vh;
            overflow: hidden;
        }
        #webgl-render-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .hud-container {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; width: 92%; max-width: 540px;
            background: var(--glass-card); backdrop-filter: blur(28px);
            border: 1px solid var(--border-glow); border-radius: 28px;
            padding: 28px; box-shadow: 0 0 50px rgba(0, 243, 255, 0.2), inset 0 1px 0 rgba(255,255,255,0.15);
            display: flex; flex-direction: column; gap: 18px; pointer-events: auto;
        }
        header { text-align: center; }
        h1 {
            font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0,243,255,0.4));
        }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-family: 'Orbitron', sans-serif; font-size: 0.65rem; color: var(--text-muted); }
        select, button {
            font-family: 'Orbitron', sans-serif; outline: none;
            background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border-glow);
            color: #fff; padding: 12px; border-radius: 14px; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.3s;
        }
        select:hover, button:hover { border-color: var(--neon-cyan); box-shadow: 0 0 20px var(--cyan-glow); }
        .stats-dashboard {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            background: rgba(2, 6, 23, 0.6); padding: 12px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.06); text-align: center;
        }
        .stat-card .title { font-size: 0.65rem; color: var(--text-muted); font-weight: 600; }
        .stat-card .val { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900; }
        .stat-card.x .val { color: var(--neon-cyan); text-shadow: 0 0 12px var(--cyan-glow); }
        .stat-card.o .val { color: var(--neon-magenta); text-shadow: 0 0 12px var(--magenta-glow); }
        .status-box {
            font-family: 'Orbitron', sans-serif; font-size: 0.95rem; font-weight: 700; text-align: center;
            padding: 12px; border-radius: 14px; background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.2);
            color: var(--neon-cyan); text-shadow: 0 0 12px var(--cyan-glow);
        }
        .btn-launch { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta)); color: #000; border: none; font-weight: 900; }
    </style>
</head>
<body>
    <canvas id="webgl-render-canvas"></canvas>

    <div class="hud-container">
        <header>
            <h1>VELHA 3D ULTRA SENIOR</h1>
            <p style="color:var(--text-muted);font-size:0.8rem;letter-spacing:1px;margin-top:2px;">ANTIGRAVITY DIRECT THREE.JS 3D ENGINE</p>
        </header>

        <div class="controls-grid">
            <div class="control-group">
                <label>MODO DE SISTEMA</label>
                <select id="mode-sel"><option value="pve">HUMANO VS PC</option><option value="pvp">2 JOGADORES</option><option value="spec">PC VS PC (ESPECTADOR)</option></select>
            </div>
            <div class="control-group">
                <label>INTELIGÊNCIA IA</label>
                <select id="diff-sel"><option value="grandmaster">GRANDMASTER (ALPHA-BETA 3D)</option><option value="medium">MÉDIO</option><option value="easy">FÁCIL</option></select>
            </div>
        </div>

        <div class="stats-dashboard">
            <div class="stat-card x"><div class="title">HUMAN (X)</div><div class="val" id="sx">0</div></div>
            <div class="stat-card"><div class="title">EMPATES</div><div class="val" id="st">0</div></div>
            <div class="stat-card o"><div class="title">AI (O)</div><div class="val" id="so">0</div></div>
        </div>

        <div class="status-box" id="status-box">MATRIZ 3D PRONTA — VEZ DO JOGADOR X</div>

        <button class="btn-launch" id="btn-restart">REINICIAR MATRIZ 3D</button>
    </div>

    <script>
        // Senior 3D WebGL Engine & Spatial Sound Synthesizer
        class Audio3DSynth {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playTone(freq, duration = 0.12, type = 'sine') {
                this.init();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            }
        }

        class Senior3DEngine {
            constructor() {
                this.canvas = document.getElementById('webgl-render-canvas');
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: true });

                this.board = Array(9).fill('');
                this.turn = 'X';
                this.active = true;
                this.mode = 'pve';
                this.difficulty = 'grandmaster';
                this.scores = { X: 0, O: 0, ties: 0 };
                this.wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

                this.nodes = [];
                this.meshes = [];
                this.particles = [];

                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                this.audio = new Audio3DSynth();

                this.init();
            }

            init() {
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                this.camera.position.set(0, 9, 13);
                this.camera.lookAt(0, 0, 0);

                // Lighting System
                const ambient = new THREE.AmbientLight(0xffffff, 0.5);
                this.scene.add(ambient);

                const spot1 = new THREE.SpotLight(0x00f3ff, 3);
                spot1.position.set(-6, 8, 6);
                this.scene.add(spot1);

                const spot2 = new THREE.SpotLight(0xff0055, 3);
                spot2.position.set(6, 8, -6);
                this.scene.add(spot2);

                this.build3DBoard();
                this.bindEvents();
                this.render();
            }

            build3DBoard() {
                // Metallic Platform
                const platGeo = new THREE.BoxGeometry(7.4, 0.25, 7.4);
                const platMat = new THREE.MeshStandardMaterial({ color: 0x091224, roughness: 0.2, metalness: 0.9 });
                const platMesh = new THREE.Mesh(platGeo, platMat);
                platMesh.position.y = -0.25;
                this.scene.add(platMesh);

                // 9 Interactive 3D Nodes
                const nodeGeo = new THREE.BoxGeometry(2.1, 0.12, 2.1);
                const positions = [
                    [-2.3, 0, -2.3], [0, 0, -2.3], [2.3, 0, -2.3],
                    [-2.3, 0, 0],    [0, 0, 0],    [2.3, 0, 0],
                    [-2.3, 0, 2.3],  [0, 0, 2.3],  [2.3, 0, 2.3]
                ];

                positions.forEach((pos, idx) => {
                    const mat = new THREE.MeshStandardMaterial({ color: 0x111c33, roughness: 0.3, metalness: 0.7 });
                    const node = new THREE.Mesh(nodeGeo, mat);
                    node.position.set(...pos);
                    node.userData = { index: idx };
                    this.scene.add(node);
                    this.nodes.push(node);
                });
            }

            bindEvents() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });

                window.addEventListener('pointerdown', (e) => {
                    if (e.target.tagName !== 'CANVAS' || !this.active) return;
                    if (this.mode === 'pve' && this.turn !== 'X') return;

                    this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                    this.raycaster.setFromCamera(this.mouse, this.camera);
                    const intersects = this.raycaster.intersectObjects(this.nodes);

                    if (intersects.length > 0) {
                        const idx = intersects[0].object.userData.index;
                        if (this.board[idx] === '') {
                            this.play(idx, this.turn);
                            if (this.active && this.mode === 'pve' && this.turn === 'O') {
                                setTimeout(() => this.aiPlay(), 350);
                            }
                        }
                    }
                });

                document.getElementById('btn-restart').addEventListener('click', () => this.restart());
                document.getElementById('mode-sel').addEventListener('change', e => { this.mode = e.target.value; this.restart(); });
                document.getElementById('diff-sel').addEventListener('change', e => { this.difficulty = e.target.value; this.restart(); });
            }

            play(idx, p) {
                this.board[idx] = p;
                const pos = this.nodes[idx].position;

                if (p === 'X') {
                    const group = new THREE.Group();
                    const mat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00f3ff, emissiveIntensity: 0.8 });
                    const g = new THREE.BoxGeometry(0.45, 0.45, 1.9);
                    const m1 = new THREE.Mesh(g, mat); m1.rotation.y = Math.PI / 4;
                    const m2 = new THREE.Mesh(g, mat); m2.rotation.y = -Math.PI / 4;
                    group.add(m1, m2);
                    group.position.set(pos.x, pos.y + 0.45, pos.z);
                    this.scene.add(group);
                    this.meshes.push(group);
                } else {
                    const geo = new THREE.TorusGeometry(0.65, 0.2, 16, 32);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.8 });
                    const torus = new THREE.Mesh(geo, mat);
                    torus.rotation.x = Math.PI / 2;
                    torus.position.set(pos.x, pos.y + 0.45, pos.z);
                    this.scene.add(torus);
                    this.meshes.push(torus);
                }

                this.audio.playTone(p === 'X' ? 650 : 420);
                this.burstParticles(pos, p === 'X' ? 0x00f3ff : 0xff0055);

                const winCombo = this.checkWin(this.board, p);
                if (winCombo) {
                    this.active = false; this.scores[p]++; this.updateScores();
                    document.getElementById('status-box').textContent = `VICTORY DETECTED: JOGADOR ${p}!`;
                    this.audio.playTone(950, 0.4, 'triangle'); return;
                }

                if (this.board.every(cell => cell !== '')) {
                    this.active = false; this.scores.ties++; this.updateScores();
                    document.getElementById('status-box').textContent = 'SYSTEM DRAW: EMPATE 3D!'; return;
                }

                this.turn = this.turn === 'X' ? 'O' : 'X';
                document.getElementById('status-box').textContent = `VEZ DO JOGADOR ${this.turn}`;
            }

            aiPlay() {
                let i = this.getBest();
                if (i !== undefined && i !== -1) this.play(i, 'O');
            }

            getBest() {
                let bestScore = -Infinity, bestMove = -1;
                for (let i = 0; i < 9; i++) {
                    if (this.board[i] === '') {
                        this.board[i] = 'O';
                        let score = this.minimax(this.board, 0, false, -Infinity, Infinity);
                        this.board[i] = '';
                        if (score > bestScore) { bestScore = score; bestMove = i; }
                    }
                }
                return bestMove;
            }

            minimax(b, depth, isMax, alpha, beta) {
                if (this.checkWin(b, 'O')) return 10 - depth;
                if (this.checkWin(b, 'X')) return depth - 10;
                if (b.every(cell => cell)) return 0;
                if (isMax) {
                    let best = -Infinity;
                    for (let i = 0; i < 9; i++) {
                        if (b[i] === '') {
                            b[i] = 'O';
                            best = Math.max(best, this.minimax(b, depth + 1, false, alpha, beta));
                            b[i] = '';
                            alpha = Math.max(alpha, best);
                            if (beta <= alpha) break;
                        }
                    }
                    return best;
                } else {
                    let best = Infinity;
                    for (let i = 0; i < 9; i++) {
                        if (b[i] === '') {
                            b[i] = 'X';
                            best = Math.min(best, this.minimax(b, depth + 1, true, alpha, beta));
                            b[i] = '';
                            beta = Math.min(beta, best);
                            if (beta <= alpha) break;
                        }
                    }
                    return best;
                }
            }

            checkWin(b, p) { return this.wins.find(c => c.every(idx => b[idx] === p)); }

            burstParticles(pos, colorHex) {
                const pGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
                const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
                for (let i = 0; i < 35; i++) {
                    const p = new THREE.Mesh(pGeo, pMat);
                    p.position.copy(pos);
                    p.userData = {
                        vx: (Math.random() - 0.5) * 0.25,
                        vy: Math.random() * 0.25 + 0.12,
                        vz: (Math.random() - 0.5) * 0.25,
                        life: 1
                    };
                    this.scene.add(p);
                    this.particles.push(p);
                }
            }

            updateScores() {
                document.getElementById('sx').textContent = this.scores.X;
                document.getElementById('so').textContent = this.scores.O;
                document.getElementById('st').textContent = this.scores.ties;
            }

            restart() {
                this.board.fill('');
                this.meshes.forEach(m => this.scene.remove(m));
                this.meshes = [];
                this.turn = 'X'; this.active = true;
                document.getElementById('status-box').textContent = 'MATRIZ 3D PRONTA — VEZ DO JOGADOR X';
            }

            render() {
                requestAnimationFrame(() => this.render());

                const time = Date.now() * 0.0006;
                this.camera.position.x = Math.sin(time) * 12;
                this.camera.position.z = Math.cos(time) * 12;
                this.camera.lookAt(0, 0, 0);

                this.particles.forEach((p, idx) => {
                    p.position.x += p.userData.vx;
                    p.position.y += p.userData.vy;
                    p.position.z += p.userData.vz;
                    p.userData.life -= 0.02;
                    if (p.userData.life <= 0) {
                        this.scene.remove(p);
                        this.particles.splice(idx, 1);
                    }
                });

                this.renderer.render(this.scene, this.camera);
            }
        }

        document.addEventListener('DOMContentLoaded', () => new Senior3DEngine());
    </script>
</body>
</html>
