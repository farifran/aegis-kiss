# =========================================================
# AEGIS HARNESS — MUTATION SUBSTRATE PROFILE
# =========================================================
#
# Version: 1.1 (Optimized)
# Layer: Mutation Substrate
# Status: Operational
#
# This configuration is intended for:
# - automated mutation substrate execution
# - runtime-governed bounded mutation
# - non-interactive aider invocation inside git worktrees
#
# The runtime owns:
# - worktree lifecycle
# - capability exposure
# - mutation target selection
# - artifact promotion
#
# =========================================================

# ---------------------------------------------------------
# NON-INTERACTIVE OPERATION
# ---------------------------------------------------------

yes-always: true
stream: false
pretty: false
multiline: false
fancy-input: false

# ---------------------------------------------------------
# GIT OWNERSHIP
# ---------------------------------------------------------

# The runtime owns the worktree lifecycle.
# Aider must not commit, push, or manage git state.
no-auto-commits: true
dirty-commits: false
attribute-author: false
attribute-committer: false

# ---------------------------------------------------------
# OUTPUT CONTROL
# ---------------------------------------------------------

show-model-warnings: false
suggest-shell-commands: false
detect-urls: false
notifications: false
show-diffs: false

# ---------------------------------------------------------
# LINTER & TEST DELEGATION (Aegis owns preflight gates)
# ---------------------------------------------------------

auto-lint: false
auto-test: false

# ---------------------------------------------------------
# EDITING
# ---------------------------------------------------------

encoding: utf-8
line-endings: lf

# ---------------------------------------------------------
# CACHE & PERFORMANCE
# ---------------------------------------------------------

# Enable API prompt caching for preambles (AGENTS.md) and skills (.skills/repair.md)
cache-prompts: true

# ---------------------------------------------------------
# NON-INTERACTIVE EXIT GUARANTEE
# ---------------------------------------------------------

# Exit after processing --message-file without entering interactive REPL.
exit: true

# ---------------------------------------------------------
# UPDATE CHECK
# ---------------------------------------------------------

check-update: false
