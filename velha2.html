<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe AAA Cyberpunk Ultra | Antigravity Direct Build</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020617;
            --neon-cyan: #00f3ff;
            --cyan-glow: rgba(0, 243, 255, 0.5);
            --neon-magenta: #ff0055;
            --magenta-glow: rgba(255, 0, 85, 0.5);
            --neon-purple: #a855f7;
            --card-glass: rgba(15, 23, 42, 0.8);
            --border-glow: rgba(0, 243, 255, 0.25);
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; padding: 20px;
        }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
        .app-container {
            position: relative; z-index: 10;
            width: 100%; max-width: 500px;
            background: var(--card-glass);
            backdrop-filter: blur(28px);
            border: 1px solid var(--border-glow);
            border-radius: 32px;
            padding: 36px 32px;
            box-shadow: 0 0 60px rgba(0, 243, 255, 0.12), inset 0 1px 0 rgba(255,255,255,0.15);
            display: flex; flex-direction: column; gap: 22px;
        }
        header { text-align: center; }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.1rem; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-magenta) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0,243,255,0.3));
        }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-family: 'Orbitron', sans-serif; font-size: 0.65rem; color: var(--text-muted); letter-spacing: 1px; }
        select, button {
            font-family: 'Orbitron', sans-serif; outline: none;
            background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border-glow);
            color: var(--text-main); padding: 12px 14px; border-radius: 16px;
            font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.3s;
        }
        select:hover, button:hover { border-color: var(--neon-cyan); box-shadow: 0 0 20px var(--cyan-glow); transform: translateY(-2px); }
        .analytics-bar {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            background: rgba(2, 6, 23, 0.6); padding: 14px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05); text-align: center;
        }
        .stat-card .title { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }
        .stat-card .num { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900; }
        .stat-card.x .num { color: var(--neon-cyan); text-shadow: 0 0 12px var(--cyan-glow); }
        .stat-card.o .num { color: var(--neon-magenta); text-shadow: 0 0 12px var(--magenta-glow); }
        .status-display {
            font-family: 'Orbitron', sans-serif; font-size: 0.95rem; font-weight: 700;
            text-align: center; padding: 12px; border-radius: 14px;
            background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.2);
            color: var(--neon-cyan); text-shadow: 0 0 10px var(--cyan-glow);
        }
        .board-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; aspect-ratio: 1; }
        .cell-node {
            background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px; display: flex; justify-content: center; align-items: center;
            font-family: 'Orbitron', sans-serif; font-size: 3.4rem; font-weight: 900;
            cursor: pointer; transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cell-node:hover:not(.taken) { background: rgba(30, 41, 59, 0.8); border-color: var(--neon-cyan); transform: scale(1.04); }
        .cell-node.x { color: var(--neon-cyan); text-shadow: 0 0 25px var(--cyan-glow); }
        .cell-node.o { color: var(--neon-magenta); text-shadow: 0 0 25px var(--magenta-glow); }
        .cell-node.winning { animation: pulseWin 0.8s infinite alternate; background: rgba(0, 243, 255, 0.15); }
        @keyframes pulseWin { 0% { transform: scale(1); } 100% { transform: scale(1.06); box-shadow: 0 0 30px var(--neon-cyan); } }
        .action-row { display: flex; gap: 12px; }
        .btn-launch { flex: 2; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); color: #000; border: none; font-weight: 900; }
        .btn-ghost { flex: 1; background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <div class="app-container">
        <header>
            <h1>VELHA AAA ULTRA</h1>
            <p style="color:var(--text-muted);font-size:0.85rem;letter-spacing:1px;margin-top:4px;">ANTIGRAVITY DIRECT GRAPHIC ENGINE</p>
        </header>

        <div class="controls-grid">
            <div class="control-group">
                <label>MODO SISTEMA</label>
                <select id="mode-sel"><option value="pve">HUMANO VS PC</option><option value="pvp">2 JOGADORES</option><option value="spec">PC VS PC (SPECTATOR)</option></select>
            </div>
            <div class="control-group">
                <label>NÍVEL IA</label>
                <select id="diff-sel"><option value="grandmaster" selected>GRANDMASTER (ALPHA-BETA)</option><option value="medium">MÉDIO</option><option value="easy">FÁCIL</option></select>
            </div>
        </div>

        <div class="analytics-bar">
            <div class="stat-card x"><div class="title">HUMAN (X)</div><div class="num" id="sx">0</div></div>
            <div class="stat-card"><div class="title">EMPATES</div><div class="num" id="st">0</div></div>
            <div class="stat-card o"><div class="title">AI (O)</div><div class="num" id="so">0</div></div>
        </div>

        <div class="status-display" id="status-box">MATRIZ PRONTA — VEZ DO JOGADOR X</div>

        <div class="board-grid" id="board">
            <button class="cell-node" data-i="0"></button><button class="cell-node" data-i="1"></button><button class="cell-node" data-i="2"></button>
            <button class="cell-node" data-i="3"></button><button class="cell-node" data-i="4"></button><button class="cell-node" data-i="5"></button>
            <button class="cell-node" data-i="6"></button><button class="cell-node" data-i="7"></button><button class="cell-node" data-i="8"></button>
        </div>

        <div class="action-row">
            <button class="btn-launch" id="btn-restart">RESET MATRIX</button>
            <button class="btn-ghost" id="btn-reset-stat">ZERAR DATA</button>
        </div>
    </div>

    <script>
        // High-Performance 60FPS Particle System
        class ParticleEngine {
            constructor(id) {
                this.canvas = document.getElementById(id);
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.render();
            }
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; }
            burst(x, y, color) {
                for (let i = 0; i < 75; i++) {
                    this.particles.push({
                        x, y, vx: (Math.random() - 0.5) * 16, vy: (Math.random() - 0.5) * 16 - 2,
                        size: Math.random() * 6 + 2, color, life: 1, decay: Math.random() * 0.025 + 0.015
                    });
                }
            }
            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles.forEach((p, idx) => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= p.decay;
                    if (p.life <= 0) { this.particles.splice(idx, 1); return; }
                    this.ctx.save(); this.ctx.globalAlpha = p.life;
                    this.ctx.shadowBlur = 15; this.ctx.shadowColor = p.color;
                    this.ctx.fillStyle = p.color; this.ctx.fillRect(p.x, p.y, p.size, p.size);
                    this.ctx.restore();
                });
                requestAnimationFrame(() => this.render());
            }
        }

        // Web Audio Polyphonic Synthesizer
        class AudioSystem {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playTone(freq, duration = 0.1, type = 'sine') {
                this.init();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            }
        }

        class GameEngine {
            constructor() {
                this.board = Array(9).fill('');
                this.turn = 'X';
                this.active = true;
                this.mode = 'pve';
                this.difficulty = 'grandmaster';
                this.scores = { X: 0, O: 0, ties: 0 };
                this.wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                this.fx = new ParticleEngine('particle-canvas');
                this.audio = new AudioSystem();
                this.bind();
            }
            bind() {
                this.nodes = document.querySelectorAll('.cell-node');
                this.status = document.getElementById('status-box');
                this.nodes.forEach(n => n.addEventListener('click', e => this.handleTouch(e)));
                document.getElementById('btn-restart').addEventListener('click', () => this.restart());
                document.getElementById('btn-reset-stat').addEventListener('click', () => {
                    this.scores = { X: 0, O: 0, ties: 0 }; this.updateUI(); this.restart();
                });
                document.getElementById('mode-sel').addEventListener('change', e => { this.mode = e.target.value; this.restart(); });
                document.getElementById('diff-sel').addEventListener('change', e => { this.difficulty = e.target.value; this.restart(); });
            }
            handleTouch(e) {
                const i = parseInt(e.target.dataset.i);
                if (this.board[i] || !this.active) return;
                if (this.mode === 'pve' && this.turn !== 'X') return;
                const rect = e.target.getBoundingClientRect();
                this.fx.burst(rect.left + rect.width / 2, rect.top + rect.height / 2, this.turn === 'X' ? '#00f3ff' : '#ff0055');
                this.executeMove(i, this.turn);
                if (this.active && this.mode === 'pve' && this.turn === 'O') {
                    setTimeout(() => this.aiMove(), 320);
                }
            }
            executeMove(i, p) {
                this.board[i] = p; this.nodes[i].textContent = p; this.nodes[i].classList.add(p.toLowerCase(), 'taken');
                this.audio.playTone(p === 'X' ? 620 : 420);
                const winCombo = this.checkWin(this.board, p);
                if (winCombo) {
                    this.active = false; this.scores[p]++; this.updateUI();
                    winCombo.forEach(idx => this.nodes[idx].classList.add('winning'));
                    this.status.textContent = `VICTORY DETECTED: JOGADOR ${p}!`;
                    this.audio.playTone(900, 0.4, 'triangle'); return;
                }
                if (this.board.every(cell => cell)) {
                    this.active = false; this.scores.ties++; this.updateUI();
                    this.status.textContent = 'SYSTEM DRAW: EMPATE!'; return;
                }
                this.turn = this.turn === 'X' ? 'O' : 'X';
                this.status.textContent = `VEZ DO JOGADOR ${this.turn}`;
            }
            aiMove() {
                let moveIndex;
                if (this.difficulty === 'easy') moveIndex = this.getRandom();
                else if (this.difficulty === 'medium') moveIndex = Math.random() < 0.5 ? this.getBest() : this.getRandom();
                else moveIndex = this.getBest();
                if (moveIndex !== undefined && moveIndex !== -1) {
                    const rect = this.nodes[moveIndex].getBoundingClientRect();
                    this.fx.burst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#ff0055');
                    this.executeMove(moveIndex, 'O');
                }
            }
            getRandom() {
                const free = this.board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
                return free[Math.floor(Math.random() * free.length)];
            }
            getBest() {
                let bestScore = -Infinity, bestMove = -1;
                for (let i = 0; i < 9; i++) {
                    if (this.board[i] === '') {
                        this.board[i] = 'O';
                        let score = this.minimax(this.board, 0, false, -Infinity, Infinity);
                        this.board[i] = '';
                        if (score > bestScore) { bestScore = score; bestMove = i; }
                    }
                }
                return bestMove;
            }
            minimax(b, depth, isMax, alpha, beta) {
                if (this.checkWin(b, 'O')) return 10 - depth;
                if (this.checkWin(b, 'X')) return depth - 10;
                if (b.every(cell => cell)) return 0;
                if (isMax) {
                    let best = -Infinity;
                    for (let i = 0; i < 9; i++) {
                        if (b[i] === '') {
                            b[i] = 'O';
                            best = Math.max(best, this.minimax(b, depth + 1, false, alpha, beta));
                            b[i] = '';
                            alpha = Math.max(alpha, best);
                            if (beta <= alpha) break;
                        }
                    }
                    return best;
                } else {
                    let best = Infinity;
                    for (let i = 0; i < 9; i++) {
                        if (b[i] === '') {
                            b[i] = 'X';
                            best = Math.min(best, this.minimax(b, depth + 1, true, alpha, beta));
                            b[i] = '';
                            beta = Math.min(beta, best);
                            if (beta <= alpha) break;
                        }
                    }
                    return best;
                }
            }
            checkWin(b, p) { return this.wins.find(c => c.every(idx => b[idx] === p)); }
            updateUI() {
                document.getElementById('sx').textContent = this.scores.X;
                document.getElementById('so').textContent = this.scores.O;
                document.getElementById('st').textContent = this.scores.T;
            }
            restart() {
                this.board.fill(''); this.turn = 'X'; this.active = true;
                this.nodes.forEach(n => { n.textContent = ''; n.className = 'cell-node'; });
                this.status.textContent = 'MATRIZ PRONTA — VEZ DO JOGADOR X';
            }
        }
        document.addEventListener('DOMContentLoaded', () => new GameEngine());
    </script>
</body>
</html>
