# =========================================================
# AEGIS — structural physics (Zero-GC / Dynamic Allocation Gate)
# Dynamic allocations in hot path violate AXIOMA III.
# =========================================================

id: no-hotpath-dynamic-allocation

language: TypeScript

severity: error

message: >
  Dynamic heap allocation (.slice(), Array.from(), new Map/Set in loops) detected. Hot-path algorithms must operate on pre-allocated buffers or in-place primitive indexing.

rule:
  any:
    - pattern: 'Array.from($$$ARGS)'
    - pattern: '$VAR.slice($$$ARGS)'
    - pattern: 'new Map($$$ARGS)'
    - pattern: 'new Set($$$ARGS)'

