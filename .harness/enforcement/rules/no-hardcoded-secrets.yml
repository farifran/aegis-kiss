# =========================================================
# AEGIS — structural physics (TypeScript & JavaScript)
# Hardcoded API keys or secrets in source files.
# =========================================================

id: no-hardcoded-secrets

language: TypeScript

severity: error

message: >
  Hardcoded secrets or API keys detected. Use environment variables instead.

rule:
  any:
    - pattern: '"sk-$$$KEY"'
    - pattern: "'sk-$$$KEY'"
    - pattern: '"ghp_$$$KEY"'
    - pattern: "'ghp_$$$KEY'"
