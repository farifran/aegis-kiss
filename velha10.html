<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cyberpunk Tic-Tac-Toe Ultra | Aegis Build</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --glass-bg: rgba(10, 15, 30, 0.75);
            --border-glow: rgba(0, 243, 255, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #02040a;
            color: #f8fafc;
            min-height: 100vh;
            overflow: hidden;
        }
        #canvas3d { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .hud-overlay {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; width: 90%; max-width: 520px;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow); border-radius: 24px;
            padding: 24px 28px; box-shadow: 0 0 40px rgba(0, 243, 255, 0.15);
            display: flex; flex-direction: column; gap: 16px; pointer-events: auto;
        }
        h1 {
            font-family: 'Orbitron', sans-serif; font-size: 1.6rem; text-align: center;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .hud-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        select, button {
            font-family: 'Orbitron', sans-serif;
            background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border-glow);
            color: #fff; padding: 10px; border-radius: 12px; font-size: 0.75rem; cursor: pointer;
        }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 12px; }
        .stat-val { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 900; }
        .status-msg { text-align: center; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; color: var(--neon-cyan); }
    </style>
</head>
<body>
    <canvas id="canvas3d"></canvas>

    <div class="hud-overlay">
        <h1>TIC-TAC-TOE 3D AEGIS</h1>
        <div class="hud-controls">
            <select id="mode"><option value="pve">Humano vs PC</option><option value="pvp">2 Jogadores</option><option value="spec">PC vs PC (Espectador)</option></select>
            <select id="diff"><option value="impossible">Grandmaster AI (3D)</option><option value="medium">Médio</option><option value="easy">Fácil</option></select>
        </div>
        <div class="stats-grid">
            <div><div style="font-size:0.65rem;color:#64748b">HUMAN (X)</div><div class="stat-val" style="color:var(--neon-cyan)" id="sx">0</div></div>
            <div><div style="font-size:0.65rem;color:#64748b">EMPATES</div><div class="stat-val" id="st">0</div></div>
            <div><div style="font-size:0.65rem;color:#64748b">AI (O)</div><div class="stat-val" style="color:var(--neon-pink)" id="so">0</div></div>
        </div>
        <div class="status-msg" id="status">MATRIZ 3D INICIALIZADA — VEZ DO JOGADOR X</div>
        <button id="restart" style="background:linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); color:#000; font-weight:900;">RESETAR CENA 3D</button>
    </div>

    <script>
        // Senior 3D WebGL Engine
        class Game3D {
            constructor() {
                this.container = document.getElementById('canvas3d');
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ canvas: this.container, antialias: true, alpha: true });
                
                this.board = Array(9).fill('');
                this.turn = 'X';
                this.active = true;
                this.mode = 'pve';
                this.difficulty = 'impossible';
                this.scores = { X: 0, O: 0, ties: 0 };
                this.nodes = [];
                this.meshes = [];
                this.particles = [];

                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();

                this.init();
            }

            init() {
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                this.camera.position.set(0, 8, 12);
                this.camera.lookAt(0, 0, 0);

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
                this.scene.add(ambientLight);

                const light1 = new THREE.PointLight(0x00f3ff, 2, 20);
                light1.position.set(-5, 5, 5);
                this.scene.add(light1);

                const light2 = new THREE.PointLight(0xff0055, 2, 20);
                light2.position.set(5, 5, -5);
                this.scene.add(light2);

                this.createBoard3D();
                this.bindEvents();
                this.animate();
            }

            createBoard3D() {
                // Base grid plate
                const gridGeo = new THREE.BoxGeometry(7, 0.2, 7);
                const gridMat = new THREE.MeshStandardMaterial({ color: 0x0a1020, roughness: 0.3, metalness: 0.8 });
                const gridMesh = new THREE.Mesh(gridGeo, gridMat);
                gridMesh.position.y = -0.2;
                this.scene.add(gridMesh);

                // 3D Nodes (9 clickable cells)
                const nodeGeo = new THREE.BoxGeometry(2, 0.1, 2);
                const positions = [
                    [-2.2, 0, -2.2], [0, 0, -2.2], [2.2, 0, -2.2],
                    [-2.2, 0, 0],    [0, 0, 0],    [2.2, 0, 0],
                    [-2.2, 0, 2.2],  [0, 0, 2.2],  [2.2, 0, 2.2]
                ];

                positions.forEach((pos, idx) => {
                    const mat = new THREE.MeshStandardMaterial({ color: 0x141e33, roughness: 0.4, metalness: 0.6 });
                    const node = new THREE.Mesh(nodeGeo, mat);
                    node.position.set(...pos);
                    node.userData = { index: idx };
                    this.scene.add(node);
                    this.nodes.push(node);
                });
            }

            bindEvents() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });

                window.addEventListener('pointerdown', (e) => {
                    if (e.target.tagName !== 'CANVAS' || !this.active) return;
                    if (this.mode === 'pve' && this.turn !== 'X') return;

                    this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                    this.raycaster.setFromCamera(this.mouse, this.camera);
                    const intersects = this.raycaster.intersectObjects(this.nodes);

                    if (intersects.length > 0) {
                        const idx = intersects[0].object.userData.index;
                        if (this.board[idx] === '') {
                            this.makeMove(idx, this.turn);
                            if (this.active && this.mode === 'pve' && this.turn === 'O') {
                                setTimeout(() => this.makeAIMove(), 400);
                            }
                        }
                    }
                });

                document.getElementById('restart').addEventListener('click', () => this.reset());
                document.getElementById('mode').addEventListener('change', (e) => { this.mode = e.target.value; this.reset(); });
            }

            makeMove(idx, player) {
                this.board[idx] = player;
                const pos = this.nodes[idx].position;

                if (player === 'X') {
                    // Create 3D X (Crossed Prisms)
                    const group = new THREE.Group();
                    const mat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00f3ff, emissiveIntensity: 0.6 });
                    const g1 = new THREE.BoxGeometry(0.4, 0.4, 1.8);
                    const m1 = new THREE.Mesh(g1, mat); m1.rotation.y = Math.PI / 4;
                    const m2 = new THREE.Mesh(g1, mat); m2.rotation.y = -Math.PI / 4;
                    group.add(m1, m2);
                    group.position.set(pos.x, pos.y + 0.4, pos.z);
                    this.scene.add(group);
                    this.meshes.push(group);
                } else {
                    // Create 3D O (Torus Mesh)
                    const geo = new THREE.TorusGeometry(0.6, 0.18, 16, 32);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.6 });
                    const torus = new THREE.Mesh(geo, mat);
                    torus.rotation.x = Math.PI / 2;
                    torus.position.set(pos.x, pos.y + 0.4, pos.z);
                    this.scene.add(torus);
                    this.meshes.push(torus);
                }

                this.spawnParticles(pos, player === 'X' ? 0x00f3ff : 0xff0055);

                if (this.checkWin(this.board, player)) {
                    this.active = false;
                    this.scores[player]++;
                    this.updateUI();
                    document.getElementById('status').textContent = `VITÓRIA 3D DO JOGADOR ${player}!`;
                    return;
                }

                if (this.board.every(b => b !== '')) {
                    this.active = false;
                    this.scores.ties++;
                    this.updateUI();
                    document.getElementById('status').textContent = `EMPATE NA MATRIZ 3D!`;
                    return;
                }

                this.turn = this.turn === 'X' ? 'O' : 'X';
                document.getElementById('status').textContent = `VEZ DO JOGADOR ${this.turn}`;
            }

            makeAIMove() {
                let best = this.minimax(this.board, 'O').index;
                if (best !== undefined) this.makeMove(best, 'O');
            }

            minimax(b, p) {
                const avail = b.map((v, i) => v === '' ? i : null).filter(v => v !== null);
                if (this.checkWin(b, 'X')) return { score: -10 };
                if (this.checkWin(b, 'O')) return { score: 10 };
                if (avail.length === 0) return { score: 0 };

                const moves = [];
                for (let i = 0; i < avail.length; i++) {
                    const idx = avail[i];
                    b[idx] = p;
                    const res = this.minimax(b, p === 'O' ? 'X' : 'O');
                    moves.push({ index: idx, score: res.score });
                    b[idx] = '';
                }

                let bestMove;
                if (p === 'O') {
                    let bestScore = -Infinity;
                    for (let i = 0; i < moves.length; i++) {
                        if (moves[i].score > bestScore) { bestScore = moves[i].score; bestMove = i; }
                    }
                } else {
                    let bestScore = Infinity;
                    for (let i = 0; i < moves.length; i++) {
                        if (moves[i].score < bestScore) { bestScore = moves[i].score; bestMove = i; }
                    }
                }
                return moves[bestMove];
            }

            checkWin(b, p) {
                const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                return wins.some(c => c.every(i => b[i] === p));
            }

            spawnParticles(pos, colorHex) {
                const pGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
                for (let i = 0; i < 25; i++) {
                    const p = new THREE.Mesh(pGeo, pMat);
                    p.position.copy(pos);
                    p.userData = {
                        vx: (Math.random() - 0.5) * 0.2,
                        vy: Math.random() * 0.2 + 0.1,
                        vz: (Math.random() - 0.5) * 0.2,
                        life: 1
                    };
                    this.scene.add(p);
                    this.particles.push(p);
                }
            }

            updateUI() {
                document.getElementById('sx').textContent = this.scores.X;
                document.getElementById('so').textContent = this.scores.O;
                document.getElementById('st').textContent = this.scores.ties;
            }

            reset() {
                this.board.fill('');
                this.meshes.forEach(m => this.scene.remove(m));
                this.meshes = [];
                this.turn = 'X';
                this.active = true;
                document.getElementById('status').textContent = 'VEZ DO JOGADOR X';
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                // Gentle camera orbit around 3D board
                const time = Date.now() * 0.0005;
                this.camera.position.x = Math.sin(time) * 11;
                this.camera.position.z = Math.cos(time) * 11;
                this.camera.lookAt(0, 0, 0);

                // Update 3D particles
                this.particles.forEach((p, idx) => {
                    p.position.x += p.userData.vx;
                    p.position.y += p.userData.vy;
                    p.position.z += p.userData.vz;
                    p.userData.life -= 0.02;
                    if (p.userData.life <= 0) {
                        this.scene.remove(p);
                        this.particles.splice(idx, 1);
                    }
                });

                this.renderer.render(this.scene, this.camera);
            }
        }

        document.addEventListener('DOMContentLoaded', () => new Game3D());
    </script>
</body>
</html>
