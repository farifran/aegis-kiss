<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe AAA Cyberpunk | Aegis Build</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-purple: #9d00ff;
            --glass: rgba(15, 23, 42, 0.75);
            --border: rgba(0, 243, 255, 0.2);
            --text: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        #webgl-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .ui-wrapper {
            position: relative; z-index: 10;
            width: 100%; max-width: 490px;
            background: var(--glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.15), inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 20px;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.9rem; text-align: center; letter-spacing: 2px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }
        .hud { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        select, button {
            font-family: 'Orbitron', sans-serif;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: var(--text); padding: 12px; border-radius: 14px;
            font-size: 0.8rem; cursor: pointer; transition: all 0.3s;
        }
        select:hover, button:hover { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }
        .stats {
            display: grid; grid-template-columns: repeat(3, 1fr);
            background: rgba(0,0,0,0.4); padding: 12px; border-radius: 16px; text-align: center;
        }
        .stat-val { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900; }
        .val-x { color: var(--neon-cyan); text-shadow: 0 0 12px var(--neon-cyan); }
        .val-o { color: var(--neon-pink); text-shadow: 0 0 12px var(--neon-pink); }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; aspect-ratio: 1; }
        .cell {
            background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; display: flex; justify-content: center; align-items: center;
            font-family: 'Orbitron', sans-serif; font-size: 3.2rem; font-weight: 900;
            cursor: pointer; transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cell.x { color: var(--neon-cyan); text-shadow: 0 0 20px var(--neon-cyan); }
        .cell.o { color: var(--neon-pink); text-shadow: 0 0 20px var(--neon-pink); }
        .status { text-align: center; font-size: 1.1rem; font-weight: 700; color: var(--neon-cyan); }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <div class="ui-wrapper">
        <h1>TIC-TAC-TOE AAA</h1>
        <div class="hud">
            <select id="mode"><option value="pve">Humano vs PC</option><option value="pvp">2 Jogadores</option><option value="spectator">PC vs PC (Espectador)</option></select>
            <select id="diff"><option value="impossible">Grandmaster (Alpha-Beta)</option><option value="medium">Médio</option><option value="easy">Fácil</option></select>
        </div>
        <div class="stats">
            <div><div style="font-size:0.7rem;color:#64748b">X (HUMAN)</div><div class="stat-val val-x" id="sx">0</div></div>
            <div><div style="font-size:0.7rem;color:#64748b">TIES</div><div class="stat-val" id="st">0</div></div>
            <div><div style="font-size:0.7rem;color:#64748b">O (AI)</div><div class="stat-val val-o" id="so">0</div></div>
        </div>
        <div class="status" id="status">INITIALIZING NEON MATRIX...</div>
        <div class="board" id="board">
            <button class="cell" data-i="0"></button><button class="cell" data-i="1"></button><button class="cell" data-i="2"></button>
            <button class="cell" data-i="3"></button><button class="cell" data-i="4"></button><button class="cell" data-i="5"></button>
            <button class="cell" data-i="6"></button><button class="cell" data-i="7"></button><button class="cell" data-i="8"></button>
        </div>
        <button id="restart" style="background:linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); color:#000; font-weight:900;">REINICIAR MATRIX</button>
    </div>

    <script>
        // High Performance 60FPS Canvas Particle Engine
        class CanvasFX {
            constructor(id) {
                this.canvas = document.getElementById(id);
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.loop();
            }
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; }
            explode(x, y, color) {
                for (let i = 0; i < 60; i++) {
                    this.particles.push({
                        x, y, vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
                        size: Math.random() * 5 + 2, color, life: 1, decay: Math.random() * 0.02 + 0.01
                    });
                }
            }
            loop() {
                this.ctx.fillStyle = 'rgba(3, 7, 18, 0.2)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles.forEach((p, i) => {
                    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
                    if (p.life <= 0) { this.particles.splice(i, 1); return; }
                    this.ctx.save(); this.ctx.globalAlpha = p.life;
                    this.ctx.shadowBlur = 10; this.ctx.shadowColor = p.color;
                    this.ctx.fillStyle = p.color; this.ctx.fillRect(p.x, p.y, p.size, p.size);
                    this.ctx.restore();
                });
                requestAnimationFrame(() => this.loop());
            }
        }

        // Web Audio Polyphonic Synth
        class AudioFX {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playTone(freq, type = 'sine', duration = 0.1) {
                this.init();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            }
        }

        const fx = new CanvasFX('webgl-canvas');
        const audio = new AudioFX();
        let board = Array(9).fill(''), turn = 'X', active = true, scores = {X:0, O:0, T:0};
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        const cells = document.querySelectorAll('.cell'), status = document.getElementById('status');
        status.textContent = 'VEZ DO JOGADOR X';

        cells.forEach(c => c.addEventListener('click', e => {
            const i = e.target.dataset.i;
            if (board[i] || !active) return;
            const rect = e.target.getBoundingClientRect();
            fx.explode(rect.left + rect.width / 2, rect.top + rect.height / 2, turn === 'X' ? '#00f3ff' : '#ff0055');
            move(i, turn);
            if (active && document.getElementById('mode').value === 'pve' && turn === 'O') {
                setTimeout(aiMove, 300);
            }
        }));

        function move(i, p) {
            board[i] = p; cells[i].textContent = p; cells[i].classList.add(p.toLowerCase());
            audio.playTone(p === 'X' ? 600 : 400);
            if (checkWin(board, p)) {
                active = false; scores[p]++; updateScores();
                status.textContent = `CRITICAL WIN: JOGADOR ${p}!`;
                audio.playTone(800, 'triangle', 0.4); return;
            }
            if (board.every(b => b)) {
                active = false; scores.T++; updateScores();
                status.textContent = 'SYSTEM LOCK: EMPATE!'; return;
            }
            turn = turn === 'X' ? 'O' : 'X';
            status.textContent = `VEZ DO JOGADOR ${turn}`;
        }

        function aiMove() {
            const best = minimax(board, 'O', -Infinity, Infinity).index;
            if (best !== undefined) {
                const rect = cells[best].getBoundingClientRect();
                fx.explode(rect.left + rect.width / 2, rect.top + rect.height / 2, '#ff0055');
                move(best, 'O');
            }
        }

        // Minimax Alpha-Beta Pruning
        function minimax(b, p, alpha, beta) {
            const avail = b.map((v, i) => v === '' ? i : null).filter(v => v !== null);
            if (checkWin(b, 'X')) return { score: -10 };
            if (checkWin(b, 'O')) return { score: 10 };
            if (avail.length === 0) return { score: 0 };

            const moves = [];
            for (let i = 0; i < avail.length; i++) {
                const idx = avail[i];
                b[idx] = p;
                const result = minimax(b, p === 'O' ? 'X' : 'O', alpha, beta);
                moves.push({ index: idx, score: result.score });
                b[idx] = '';
                if (p === 'O') {
                    alpha = Math.max(alpha, result.score);
                    if (beta <= alpha) break;
                } else {
                    beta = Math.min(beta, result.score);
                    if (beta <= alpha) break;
                }
            }

            let bestMove;
            if (p === 'O') {
                let bestScore = -Infinity;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score > bestScore) { bestScore = moves[i].score; bestMove = i; }
                }
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score < bestScore) { bestScore = moves[i].score; bestMove = i; }
                }
            }
            return moves[bestMove];
        }

        function checkWin(b, p) { return wins.some(c => c.every(i => b[i] === p)); }
        function updateScores() {
            document.getElementById('sx').textContent = scores.X;
            document.getElementById('so').textContent = scores.O;
            document.getElementById('st').textContent = scores.T;
        }
        document.getElementById('restart').addEventListener('click', () => {
            board.fill(''); cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
            turn = 'X'; active = true; status.textContent = 'VEZ DO JOGADOR X';
        });
    </script>
</body>
</html>
